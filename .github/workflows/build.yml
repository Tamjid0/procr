name: Build, Test, and Push to GHCR

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}

      - name: Smoke test (imports + syntax)
        run: |
          docker run --rm ${{ steps.meta.outputs.tags }} python -c "
          # Test imports only (no GPU needed)
          from app.services.adapter import MinerUAdapter
          from app.main import app, OCRRequest
          print('✅ All imports OK')
          routes = [r.path for r in app.routes if hasattr(r, 'path')]
          print(f'   Routes: {routes}')
          print(f'   OCRRequest fields: {list(OCRRequest.model_fields.keys())}')
          "

      - name: Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
