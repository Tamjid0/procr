name: Build, Test, and Push to GHCR

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}

      - name: Smoke test (syntax + imports)
        run: |
          docker run --rm --entrypoint python ${{ steps.meta.outputs.tags }} -c "
          import ast, sys
          for f in ['app/main.py', 'app/core/model_manager.py', 'app/services/adapter.py']:
              try:
                  ast.parse(open(f).read())
                  print(f'✅ {f} - syntax OK')
              except SyntaxError as e:
                  print(f'❌ {f} - {e}'); sys.exit(1)
          print('✅ All files pass syntax check')
          "

      - name: Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
